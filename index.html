<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ground Floor 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <script type="module" crossorigin src="./assets/index-Bc4Y6HGC.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DTgVTzY8.css">
</head>
<body>
<div id="stage">
  <div id="labels"></div>
  <section class="panel" id="panel" aria-label="View controls">
    <div class="panel-head">
      <div>
        <h1>Ground floor</h1>
        <p class="sub">4.85 &times; 8.77 m ext &middot; scaled from the <b>3.06 m</b> wall</p>
      </div>
      <button id="panel-toggle" class="icon-btn" type="button" aria-expanded="true" aria-controls="panel-body" title="Minimise controls">&minus;</button>
    </div>
    <div class="panel-body" id="panel-body">
    <div class="group">
      <span class="group-label" id="lbl-view">View</span>
      <div class="seg" role="group" aria-labelledby="lbl-view">
        <button id="view-media" type="button" data-view="media" aria-pressed="true">Media wall</button>
        <button id="view-sofa" type="button" data-view="sofa" aria-pressed="false">From the sofa</button>
        <button id="view-overview" type="button" data-view="overview" aria-pressed="false">Overview</button>
        <button id="view-top" type="button" data-view="top" aria-pressed="false">Top down</button>
        <button id="view-patio" type="button" data-view="patio" aria-pressed="false">From the patio</button>
        <button id="view-curtains" type="button" data-view="curtains" aria-pressed="false">Patio curtains</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label" id="lbl-light">Light</span>
      <div class="seg" role="group" aria-labelledby="lbl-light">
        <button id="light-day" type="button" data-mood="day" aria-pressed="true">Day</button>
        <button id="light-evening" type="button" data-mood="evening" aria-pressed="false">Evening</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label" id="lbl-walls">Wall behind the sofa</span>
      <div class="seg" role="group" aria-labelledby="lbl-walls">
        <button id="walls-full" type="button" data-walls="2.4" aria-pressed="true">Full height</button>
        <button id="walls-cut" type="button" data-walls="1.1" aria-pressed="false">Half wall, 1.1 m</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label" id="lbl-chairs">Chairs</span>
      <div class="seg" role="group" aria-labelledby="lbl-chairs">
        <button id="chairs-in" type="button" data-chairs="in" aria-pressed="true">Pushed in</button>
        <button id="chairs-out" type="button" data-chairs="out" aria-pressed="false">Pulled out</button>
      </div>
    </div>
    <div class="group">
      <span class="group-label" id="lbl-guests">Guest chairs</span>
      <div class="seg" role="group" aria-labelledby="lbl-guests">
        <button id="guests-off" type="button" data-guests="off" aria-pressed="true">In storage</button>
        <button id="guests-on" type="button" data-guests="on" aria-pressed="false">Brought out</button>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite">Loading the IKEA sofa model&hellip;</p>
    </div>
  </section>

  <aside class="panel editor" id="editor" aria-label="Design">
    <div class="panel-head">
      <div>
        <h2>Design</h2>
        <p class="sub" id="design-status" aria-live="polite">Loading&hellip;</p>
      </div>
      <div class="head-actions">
        <button id="undo" class="icon-btn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
        <button id="redo" class="icon-btn" type="button" title="Redo (Ctrl+Y)" aria-label="Redo">&#8631;</button>
        <button id="editor-toggle" class="icon-btn" type="button" aria-expanded="true" aria-controls="editor-body" title="Minimise the design panel">&minus;</button>
      </div>
    </div>
    <div class="panel-body" id="editor-body">
      <div class="tabs" role="tablist" aria-label="Design panel">
        <button id="tab-edit" type="button" role="tab" aria-selected="true" aria-controls="edit-pane">Edit</button>
        <button id="tab-shop" type="button" role="tab" aria-selected="false" aria-controls="shop-pane">Shopping list</button>
        <button id="tab-guide" type="button" role="tab" aria-selected="false" aria-controls="guide-pane">Build guide</button>
      </div>
      <div id="edit-pane" role="tabpanel" aria-labelledby="tab-edit">
        <div class="chips" id="object-chips"></div>
        <div id="inspector"></div>
      </div>
      <div id="shop-pane" role="tabpanel" aria-labelledby="tab-shop" hidden></div>
      <div id="guide-pane" role="tabpanel" aria-labelledby="tab-guide" hidden></div>
    </div>
  </aside>
  <div class="hint"><span class="mouse">drag to orbit &middot; right-drag to pan &middot; scroll to zoom &middot; click an object to edit it</span><span class="touch">drag to look around &middot; pinch to zoom &middot; tap to edit</span></div>
</div>
</body>
</html>
